[project]
name = "castiron"
version = "1.7.0"
description = "CastIron — script to published episode, even when your TTS provider dies. Self-healing audio-episode factory on Genblaze + Backblaze B2."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Edy Cu" }]
dependencies = [
    # Sponsor spine. Umbrella pin per spec (delta-genblaze-0.4.0.md): brings genblaze-core + genblaze-s3.
    # Provider bundles are behind extras (see [project.optional-dependencies].providers) and are NOT
    # required for the OFFLINE=1 path, which relies only on genblaze-core (Mock/Failing providers).
    "genblaze==0.4.1",
    # mutagen powers genblaze's ID3 manifest embedding for MP3 (the episode format).
    # It is pulled by genblaze-core[audio], but that extra also drags heavy, credentialed
    # vendor TTS clients we don't need offline — so we depend on mutagen directly.
    # Without it, MP3 embedding silently degrades to a .genblaze.json sidecar (verified at build).
    "mutagen>=1.47",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    # Security floor for a transitive dep (via pyasn1-modules): pyasn1 < 0.6.4 has
    # three HIGH DoS advisories (BER/CER/DER decoder, REAL values, OID quadratic).
    # Pinning the floor here forces the patched 0.6.4 into the resolved graph.
    "pyasn1>=0.6.4",
]

[project.optional-dependencies]
# Real-mode provider bundles (needs credentials + budget). Not installed in CI or OFFLINE.
# Kept as an extra so `uv sync --extra providers` is the one switch to go live.
providers = [
    "genblaze[audio,image,openai,assemblyai]==0.4.1",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "castiron"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["docs/assets"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]  # line length handled by formatter; long crawl-derived strings tolerated

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

# ── Automatic semantic versioning (python-semantic-release) ──────────────────
# CI runs `semantic-release version` on green main pushes: it reads Conventional
# Commit messages since the last tag, bumps the version in BOTH the pyproject and
# the package __version__, writes CHANGELOG.md, commits `chore(release): …`,
# tags `vX.Y.Z`, and cuts a GitHub Release. `feat:` → minor · `fix:`/`perf:` →
# patch · `feat!:`/`BREAKING CHANGE:` → major. No relevant commits → no bump.
[tool.semantic_release]
tag_format = "v{version}"
version_toml = ["pyproject.toml:project.version"]
version_variables = ["castiron/__init__.py:__version__"]
build_command = ""                        # deployed via Railway, not published to PyPI
commit_message = "chore(release): v{version} [skip ci]"
allow_zero_version = true                 # stay in 0.x until a deliberate 1.0.0

[tool.semantic_release.branches.main]
match = "main"

[tool.semantic_release.changelog]
# PSR v10 defaults changelog.mode to "update", which only writes when the
# "<!-- version list -->" insertion marker is present — ours wasn't, so the
# changelog silently froze while versions/tags kept advancing. "init"
# regenerates the whole changelog from history on every release (self-healing).
mode = "init"
