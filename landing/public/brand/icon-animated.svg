<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="CastIron animated icon: broadcast arcs draw outward, the break is bridged by an amber failover reroute, then the mark breathes">
  <!-- Standalone: no text, no fonts, zero external refs · SMIL + CSS · 6s loop. -->
  <defs>
    <linearGradient id="cib" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#059669"/><stop offset="0.6" stop-color="#10B981"/><stop offset="1" stop-color="#34D399"/>
    </linearGradient>
    <radialGradient id="cid" cx="0.75" cy="0.2" r="1.1">
      <stop offset="0" stop-color="#12202B"/><stop offset="1" stop-color="#070B0E"/>
    </radialGradient>
    <filter id="cig" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="10"/></filter>
    <style>
      .breathe { transform-box: fill-box; transform-origin: center; animation: br 6s ease-in-out infinite; }
      @keyframes br { 0%,58% { opacity:0;} 66%,88% { opacity:.55;} 100% { opacity:0;} }
      .dotpop { transform-box: fill-box; transform-origin: center; animation: dp 6s cubic-bezier(.2,1.4,.4,1) infinite; }
      @keyframes dp { 0% { transform: scale(.4);} 5% { transform: scale(1.15);} 8%,96% { transform: scale(1);} 100% { transform: scale(.98);} }
      .endcap { transform-box: fill-box; transform-origin: center; animation: ec 6s cubic-bezier(.2,1.4,.4,1) infinite; }
      @keyframes ec { 0%,55% { opacity:0; transform: scale(.3);} 59% { opacity:1; transform: scale(1.25);} 62%,100% { opacity:1; transform: scale(1);} }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    </style>
  </defs>

  <!-- Tile -->
  <rect x="28" y="28" width="456" height="456" rx="104" fill="url(#cid)"/>
  <rect x="28" y="28" width="456" height="456" rx="104" fill="none" stroke="rgba(148,163,184,0.22)" stroke-width="3"/>

  <!-- breathing glow behind the mark (late-phase) -->
  <circle class="breathe" cx="256" cy="256" r="150" fill="rgba(16,185,129,0.16)" filter="url(#cig)"/>

  <!-- Source dot -->
  <g class="dotpop">
    <circle cx="150" cy="366" r="34" fill="url(#cib)"/>
    <circle cx="150" cy="366" r="46" fill="none" stroke="#10B981" stroke-opacity="0.35" stroke-width="6">
      <animate attributeName="r" values="40;40;58;40" keyTimes="0;0.66;0.83;1" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values="0.35;0.35;0;0.35" keyTimes="0;0.66;0.83;1" dur="6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Signal arcs: broadcast draw-out, staggered -->
  <path d="M 150 266 A 100 100 0 0 1 250 366" fill="none" stroke="url(#cib)" stroke-width="30" stroke-linecap="round"
        pathLength="100" stroke-dasharray="100" stroke-dashoffset="100">
    <animate attributeName="stroke-dashoffset" values="100;100;0;0" keyTimes="0;0.06;0.16;1" dur="6s" repeatCount="indefinite"/>
  </path>
  <path d="M 150 196 A 170 170 0 0 1 320 366" fill="none" stroke="url(#cib)" stroke-width="30" stroke-linecap="round" stroke-opacity="0.9"
        pathLength="100" stroke-dasharray="100" stroke-dashoffset="100">
    <animate attributeName="stroke-dashoffset" values="100;100;0;0" keyTimes="0;0.13;0.25;1" dur="6s" repeatCount="indefinite"/>
  </path>
  <!-- Outer arc: two segments with the break -->
  <path d="M 150 126 A 240 240 0 0 1 287.7 175.4" fill="none" stroke="url(#cib)" stroke-width="30" stroke-linecap="round" stroke-opacity="0.8"
        pathLength="100" stroke-dasharray="100" stroke-dashoffset="100">
    <animate attributeName="stroke-dashoffset" values="100;100;0;0" keyTimes="0;0.22;0.32;1" dur="6s" repeatCount="indefinite"/>
  </path>
  <path d="M 380 366 A 240 240 0 0 0 336.6 224.3" fill="none" stroke="url(#cib)" stroke-width="30" stroke-linecap="round" stroke-opacity="0.8"
        pathLength="100" stroke-dasharray="100" stroke-dashoffset="100">
    <animate attributeName="stroke-dashoffset" values="100;100;0;0" keyTimes="0;0.22;0.32;1" dur="6s" repeatCount="indefinite"/>
  </path>

  <!-- The failover: amber reroute bridges the break, drawn by a comet -->
  <path d="M 291 145 A 272 272 0 0 1 378 231" fill="none" stroke="#F59E0B" stroke-width="24" stroke-linecap="round"
        pathLength="100" stroke-dasharray="100" stroke-dashoffset="100">
    <animate attributeName="stroke-dashoffset" values="100;100;0;0" keyTimes="0;0.42;0.56;1" dur="6s" repeatCount="indefinite"/>
  </path>
  <circle r="14" fill="#FBBF24" filter="url(#cig)" opacity="0">
    <animateMotion dur="6s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.42;0.56;1" calcMode="linear" path="M 291 145 A 272 272 0 0 1 378 231"/>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.42;0.44;0.56;0.6;1" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle class="endcap" cx="291" cy="145" r="15" fill="#F59E0B"/>
  <circle class="endcap" cx="378" cy="231" r="15" fill="#F59E0B" style="animation-delay:.12s"/>
</svg>
