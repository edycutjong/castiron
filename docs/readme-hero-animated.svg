    <style>
      .d { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
      .m { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .aur1 { animation: drift1 14s ease-in-out infinite alternate; }
      .aur2 { animation: drift2 18s ease-in-out infinite alternate; }
      @keyframes drift1 { from { transform: translate(0,0);} to { transform: translate(-90px,30px);} }
      @keyframes drift2 { from { transform: translate(0,0);} to { transform: translate(110px,-24px);} }
      .beam { animation: sweep 8s linear infinite; }
      @keyframes sweep { 0% { transform: translateX(-360px) skewX(-18deg);} 60%,100% { transform: translateX(1560px) skewX(-18deg);} }
      .brand-in { animation: rise 1.1s cubic-bezier(.16,1,.3,1) both; }
      @keyframes rise { from { opacity:0; transform: translateY(14px);} to { opacity:1; transform: translateY(0);} }
      .shine { animation: shine 3.4s ease-in-out infinite; }
      @keyframes shine { 0%,55% { transform: translateX(-140px) skewX(-24deg);} 90%,100% { transform: translateX(220px) skewX(-24deg);} }
      .pulse-metric { animation: pm 2.4s ease-in-out infinite; }
      @keyframes pm { 0%,100% { opacity:.75;} 50% { opacity:1;} }
      .arcb { transform-box: fill-box; transform-origin: center; animation: ab 2.8s ease-in-out infinite; }
      .arcb.a2 { animation-delay: .35s; } .arcb.a3 { animation-delay: .7s; }
      @keyframes ab { 0%,100% { opacity:.55;} 50% { opacity:1;} }
      .story { animation: story 8s linear infinite; }
      @keyframes story { 0% { opacity:0;} 2%,96% { opacity:1;} 100% { opacity:0;} }
      .jit { animation: jit 8s steps(2) infinite; transform-box: fill-box; transform-origin: center; }
      @keyframes jit { 0%,12.9% { transform: translate(0,0);} 13.4% { transform: translate(-2px,1px);} 14% { transform: translate(2px,-1px);} 14.6% { transform: translate(-1px,-1px);} 15.2%,100% { transform: translate(0,0);} }
      .seal { transform-box: fill-box; transform-origin: center; animation: seal 8s cubic-bezier(.2,1.4,.4,1) infinite; }
      @keyframes seal { 0%,61% { opacity:0; transform: scale(.5) rotate(-10deg);} 65% { opacity:1; transform: scale(1.12) rotate(1deg);} 67%,96% { opacity:1; transform: scale(1) rotate(0);} 100% { opacity:0; transform: scale(1);} }
      .lockpop { transform-box: fill-box; transform-origin: center; animation: lp 8s ease-out infinite; }
      @keyframes lp { 0%,55% { transform: scale(1);} 58% { transform: scale(1.18);} 61%,100% { transform: scale(1);} }
      .badge23 { transform-box: fill-box; transform-origin: center; animation: b23 8s cubic-bezier(.2,1.4,.4,1) infinite; }
      @keyframes b23 { 0%,25% { opacity:0; transform: scale(.4);} 28% { opacity:1; transform: scale(1.15);} 30%,96% { opacity:1; transform: scale(1);} 100% { opacity:0;} }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    </style>
  </defs>

