<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-label="CastIron — animated: TTS provider dies mid-run, the pipeline reroutes, gate passes, episode sealed on Backblaze B2 with the fallback recorded in the manifest">
  <!-- Standalone typography: wordmark = outlined Space Grotesk paths (zero font dependency); labels use built-in system stacks.
       Zero external refs · SMIL + CSS only · renders animated inside GitHub README <img> · 8s master loop. -->
