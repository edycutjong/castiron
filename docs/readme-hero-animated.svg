    <linearGradient id="brand" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#059669"/><stop offset=".55" stop-color="#10B981"/><stop offset="1" stop-color="#34D399"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="rgba(230,237,243,0)"/><stop offset=".5" stop-color="rgba(230,237,243,.06)"/><stop offset="1" stop-color="rgba(230,237,243,0)"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="rgba(148,163,184,0.07)" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="aur" x="-120%" y="-120%" width="340%" height="340%"><feGaussianBlur stdDeviation="46"/></filter>
